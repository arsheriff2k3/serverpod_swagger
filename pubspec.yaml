name: serverpod_swagger
description: A package to automatically generate and serve Swagger UI for a Serverpod backend.
version: 0.3.1 # Added custom path support, ApiSpecRoute, automatic redirection
homepage: https://serverpodswagger.vercel.app/
repository: https://github.com/arsheriff2k3/serverpod_swagger

executables:
  generate: serverpod_swagger_generate

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  serverpod: ^3.2.3 # Updated to Serverpod 3.2.3
  yaml: ^3.1.2      # To parse protocol.yaml
  path: ^1.9.0      # For path manipulation
  analyzer: ^10.0.1 # Updated to latest analyzer
  glob: ^2.1.3

dev_dependencies:
  test: ^1.29.0     # For testing
  lints: ^6.0.0     # For linting