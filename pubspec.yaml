name: serverpod_swagger
description: Automatically generate and serve Swagger UI for a Serverpod backend. Parses your endpoints and models to produce an OpenAPI 3.0 specification.
version: 1.0.0
homepage: https://serverpodswagger.vercel.app/
repository: https://github.com/arsheriff2k3/serverpod_swagger
topics:
  - serverpod
  - swagger
  - openapi
  - api-documentation

executables:
  generate: serverpod_swagger_generate

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  serverpod: ">=3.4.2 <4.0.0"
  yaml: ^3.1.3
  path: ^1.9.1
  analyzer: ^10.2.0
  glob: ^2.1.3

dev_dependencies:
  test: ^1.30.0
  lints: ^6.1.0
